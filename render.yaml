services:
  - type: web
    name: myfinance-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: KIS_APP_KEY
        sync: false
      - key: KIS_APP_SECRET
        sync: false
      - key: KIS_ACCOUNT_NUMBER
        sync: false
      - key: KIS_ACCOUNT_PRODUCT_CODE
        value: "01"
      - key: KIS_IS_VIRTUAL
        value: "true"
